name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  package-smoke:
    name: package-smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
      - name: Build and install the release wheel
        run: |
          uv build --out-dir dist
          smoke_venv="$(mktemp -d)/venv"
          uv venv "$smoke_venv" --python 3.12
          uv pip install \
            --python "$smoke_venv/bin/python" \
            dist/*.whl
          "$smoke_venv/bin/va" --version
          "$smoke_venv/bin/tca" --version
          "$smoke_venv/bin/va" --help
